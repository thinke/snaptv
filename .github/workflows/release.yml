name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "${v%%-*}"
          echo "SNAPTV_VERSION_NAME=$v" >> "$GITHUB_ENV"
          echo "SNAPTV_VERSION_CODE=$(( major * 10000 + minor * 100 + ${patch:-0} ))" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SNAPTV_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SNAPTV_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build release
        env:
          SNAPTV_KEYSTORE_PASSWORD: ${{ secrets.SNAPTV_KEYSTORE_PASSWORD }}
          SNAPTV_KEY_ALIAS: ${{ secrets.SNAPTV_KEY_ALIAS }}
          SNAPTV_KEY_PASSWORD: ${{ secrets.SNAPTV_KEY_PASSWORD }}
        run: |
          ./gradlew :core:test :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "snaptv-$SNAPTV_VERSION_NAME.apk"
          sha256sum "snaptv-$SNAPTV_VERSION_NAME.apk" > "snaptv-$SNAPTV_VERSION_NAME.apk.sha256"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "snaptv-$SNAPTV_VERSION_NAME.apk" "snaptv-$SNAPTV_VERSION_NAME.apk.sha256" \
            --title "SnapTV $SNAPTV_VERSION_NAME" --generate-notes \
            $([[ "$SNAPTV_VERSION_NAME" == *-* ]] && echo --prerelease)
